apiVersion: tekton.dev/v1
kind: Task
metadata: {name: finance2-build-image}
spec:
  params:
    - {name: builder-image, type: string}
    - {name: component, type: string}
    - {name: context, type: string}
    - {name: dockerfile, type: string}
    - {name: commit-sha, type: string}
  workspaces: [{name: source}, {name: artifacts}]
  results: [{name: image-archive, type: string}, {name: local-image-id, type: string}]
  steps:
    - name: assemble
      image: $(params.builder-image)
      workingDir: $(workspaces.source.path)
      env:
        - {name: STORAGE_DRIVER, value: vfs}
        - {name: BUILDAH_ISOLATION, value: chroot}
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        archive="$(workspaces.artifacts.path)/$(params.component)-$(params.commit-sha).tar"
        image="localhost/finance2/$(params.component):$(params.commit-sha)"
        buildah --storage-driver=vfs bud --isolation=chroot -f "$(params.dockerfile)" -t "$image" "$(params.context)"
        buildah --storage-driver=vfs push "$image" "oci-archive:$archive"
        buildah --storage-driver=vfs inspect --type image --format '{{.FromImageDigest}}' "$image" > "$(results.local-image-id.path)"
        printf '%s' "$archive" > "$(results.image-archive.path)"
      computeResources: {requests: {cpu: 750m, memory: 2Gi}, limits: {cpu: "1", memory: 3Gi}}
      securityContext: {runAsNonRoot: true, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
