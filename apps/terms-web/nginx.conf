worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  client_body_temp_path /tmp/client-body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;

  server {
    listen 8080;
    server_name _;
    root /opt/app-root/src;

    location = /health/live {
      access_log off;
      add_header Content-Type application/json;
      return 200 '{"status":"ok","service":"terms-web"}';
    }

    location = /health/ready {
      access_log off;
      add_header Content-Type application/json;
      if (!-f /opt/app-root/runtime-config/runtime-config.json) {
        return 503 '{"status":"unavailable","service":"terms-web","reason":"runtime-config"}';
      }
      return 200 '{"status":"ready","service":"terms-web"}';
    }

    location = /runtime-config.json {
      alias /opt/app-root/runtime-config/runtime-config.json;
      add_header Cache-Control "no-store";
      add_header Pragma "no-cache";
      expires -1;
    }

    location = /terms {
      return 308 /terms/;
    }

    location ^~ /terms/ {
      rewrite ^/terms/(.*)$ /$1 last;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|woff2)$ {
      expires 1y;
      add_header Cache-Control "public, immutable";
    }

    location = /index.html {
      add_header Cache-Control "no-cache";
    }
  }
}
