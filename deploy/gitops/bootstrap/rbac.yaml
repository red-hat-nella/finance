apiVersion: v1
kind: ServiceAccount
metadata: {name: platform-reader, namespace: rh-ee-mpolo-dev}
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: pipeline-build, namespace: rh-ee-mpolo-dev}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: gitops-reconciler, namespace: rh-ee-mpolo-dev}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: platform-reader, namespace: rh-ee-mpolo-dev}
rules:
  - apiGroups: [""]
    resources: [pods, services, configmaps, events, resourcequotas, limitranges, persistentvolumeclaims]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, replicasets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch]
  - apiGroups: [route.openshift.io]
    resources: [routes]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list, watch]
  - apiGroups: [tekton.dev]
    resources: [pipelineruns, taskruns]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: platform-reader, namespace: rh-ee-mpolo-dev}
subjects: [{kind: ServiceAccount, name: platform-reader, namespace: rh-ee-mpolo-dev}]
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: platform-reader}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: pipeline-build, namespace: rh-ee-mpolo-dev}
rules:
  - apiGroups: [image.openshift.io]
    resources: [imagestreams, imagestreamtags]
    verbs: [get, list, create, update, patch]
  - apiGroups: [tekton.dev]
    resources: [pipelineruns, taskruns]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: pipeline-build, namespace: rh-ee-mpolo-dev}
subjects: [{kind: ServiceAccount, name: pipeline-build, namespace: rh-ee-mpolo-dev}]
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: pipeline-build}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: gitops-reconciler, namespace: rh-ee-mpolo-dev}
rules:
  - apiGroups: [""]
    resources: [serviceaccounts, services, configmaps, persistentvolumeclaims]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [apps]
    resources: [deployments, statefulsets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [route.openshift.io]
    resources: [routes]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: gitops-reconciler, namespace: rh-ee-mpolo-dev}
subjects: [{kind: ServiceAccount, name: gitops-reconciler, namespace: rh-ee-mpolo-dev}]
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: gitops-reconciler}
