apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: finance2-source
  namespace: rh-ee-mpolo-dev
  labels: {app.kubernetes.io/name: finance2-source, app.kubernetes.io/part-of: alternative-credit-scoring}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: gp3
  resources: {requests: {storage: 2Gi}}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: finance2-artifacts
  namespace: rh-ee-mpolo-dev
  labels: {app.kubernetes.io/name: finance2-artifacts, app.kubernetes.io/part-of: alternative-credit-scoring}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: gp3
  resources: {requests: {storage: 10Gi}}
