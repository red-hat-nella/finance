apiVersion: platform.finance2/v1
kind: SecretReferenceContract
metadata:
  name: alternative-credit-scoring
spec:
  valuesAreForbidden: true
  references:
    - {name: ingestion-runtime, consumers: [ingestion], keys: [database-password, scoring-service-token]}
    - {name: scoring-runtime, consumers: [scoring], keys: [scoring-service-token]}
    - {name: database-migrator, consumers: [migrations], keys: [database-migrator-password]}
    - {name: database-retention, consumers: [retention], keys: [database-retention-password]}
    - {name: database-runtime, consumers: [reconciler, postgres-dev], keys: [database-password]}
    - {name: database-tls, consumers: [ingestion, migrations, retention, reconciler], keys: [ca.crt]}
    - {name: pii-keyring, consumers: [ingestion], keys: [encryption-key-v1, hmac-key-v1]}
    - {name: database-backup, consumers: [postgres-backup, postgres-restore-test], keys: [database-backup-password]}
    - {name: backup-target, consumers: [postgres-backup, postgres-restore-test], keys: [provider-reference]}
    - {name: terms-runtime, consumers: [terms-api], keys: [database-password, internal-service-token]}
    - {name: terms-migrator, consumers: [terms-migrations], keys: [database-migrator-password]}
    - {name: terms-retention, consumers: [terms-retention], keys: [database-retention-password]}
    - {name: terms-database-tls, consumers: [terms-api, terms-migrations, terms-retention, terms-backup, terms-restore-test], keys: [ca.crt]}
    - {name: terms-backup, consumers: [terms-backup, terms-restore-test], keys: [database-backup-password]}
    - {name: terms-backup-target, consumers: [terms-backup, terms-restore-test], keys: [provider-reference]}
    - {name: terms-keyring, consumers: [terms-retention], keys: [hmac-key-v1], optional: true}
