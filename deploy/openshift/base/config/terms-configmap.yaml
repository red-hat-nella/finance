apiVersion: v1
kind: ConfigMap
metadata:
  name: terms-web-config
  labels: {app.kubernetes.io/part-of: alternative-credit-scoring}
data:
  TERMS_API_BASE_URL: /terms-api
  AUTH_MODE: oidc
  OIDC_CLIENT_ID: alternative-credit-scoring-terms-web
  OIDC_SCOPE: openid profile
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: terms-api-config
  labels: {app.kubernetes.io/part-of: alternative-credit-scoring}
data:
  NODE_ENV: production
  PORT: "8080"
  DATABASE_HOST: postgres
  DATABASE_PORT: "5432"
  DATABASE_NAME: alternative_scoring
  DATABASE_SCHEMA: terms
  DATABASE_USER: terms_app
  DATABASE_SSL_MODE: disable
  AUTH_AUDIENCE: alternative-credit-scoring
  AUTH_ALLOWED_ALGORITHMS: RS256
  CONTENT_MAX_BYTES: "524288"
  INTERNAL_DECISION_TIMEOUT_MS: "500"
