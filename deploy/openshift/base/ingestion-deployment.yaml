apiVersion: apps/v1
kind: Deployment
metadata: {name: ingestion, labels: {app.kubernetes.io/name: ingestion}}
spec:
  replicas: 2
  selector: {matchLabels: {app.kubernetes.io/name: ingestion}}
  template:
    metadata: {labels: {app.kubernetes.io/name: ingestion}}
    spec:
      serviceAccountName: ingestion
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: ingestion
          image: image-registry.openshift-image-registry.svc:5000/alternative-scoring/ingestion:1.0.0
          envFrom: [{configMapRef: {name: ingestion-config}}]
          env:
            - {name: DATABASE_PASSWORD_FILE, value: /run/secrets/app/database-password}
            - {name: PII_ENCRYPTION_KEY_FILE, value: /run/secrets/app/pii-encryption-key}
            - {name: PII_HMAC_KEY_FILE, value: /run/secrets/app/pii-hmac-key}
            - {name: PII_KEY_VERSION, value: "1"}
            - {name: SCORING_SERVICE_TOKEN_FILE, value: /run/secrets/app/scoring-service-token}
          ports: [{name: http, containerPort: 8080}]
          livenessProbe: {httpGet: {path: /health/live, port: http}, initialDelaySeconds: 10}
          readinessProbe: {httpGet: {path: /health/ready, port: http}, initialDelaySeconds: 5}
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: 500m, memory: 512Mi}}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, readOnlyRootFilesystem: true}
          volumeMounts: [{name: secrets, mountPath: /run/secrets/app, readOnly: true}, {name: tmp, mountPath: /tmp}]
      volumes: [{name: secrets, secret: {secretName: scoring-secrets}}, {name: tmp, emptyDir: {}}]

