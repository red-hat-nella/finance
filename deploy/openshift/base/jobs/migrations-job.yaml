apiVersion: batch/v1
kind: Job
metadata:
  name: migrations
  labels: {app.kubernetes.io/name: migrations, app.kubernetes.io/component: database-job, app.kubernetes.io/part-of: alternative-credit-scoring}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-1"
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: {app.kubernetes.io/name: migrations, app.kubernetes.io/component: database-job, app.kubernetes.io/part-of: alternative-credit-scoring}
    spec:
      serviceAccountName: migrations
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: migrations
          image: quay.io/finance2/ingestion@sha256:2222222222222222222222222222222222222222222222222222222222222222
          command: [node, dist/jobs/migrate.js]
          env:
            - {name: DATABASE_HOST, valueFrom: {configMapKeyRef: {name: ingestion-config, key: DATABASE_HOST}}}
            - {name: DATABASE_PORT, valueFrom: {configMapKeyRef: {name: ingestion-config, key: DATABASE_PORT}}}
            - {name: DATABASE_NAME, valueFrom: {configMapKeyRef: {name: ingestion-config, key: DATABASE_NAME}}}
            - {name: DATABASE_SSL_MODE, valueFrom: {configMapKeyRef: {name: ingestion-config, key: DATABASE_SSL_MODE}}}
            - {name: DATABASE_USER, value: scoring_migrator}
            - {name: DATABASE_PASSWORD_FILE, value: /run/secrets/migrations/database-migrator-password}
          resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {cpu: 250m, memory: 256Mi}}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, readOnlyRootFilesystem: true}
          volumeMounts:
            - {name: runtime-secrets, mountPath: /run/secrets/migrations, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: runtime-secrets
          projected:
            defaultMode: 256
            sources:
              - secret:
                  name: database-migrator
                  items: [{key: database-migrator-password, path: database-migrator-password}]
        - {name: tmp, emptyDir: {sizeLimit: 64Mi}}
