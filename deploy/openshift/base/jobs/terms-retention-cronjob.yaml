apiVersion: batch/v1
kind: CronJob
metadata:
  name: terms-retention
  labels: {app.kubernetes.io/name: terms-retention, app.kubernetes.io/component: database-job, app.kubernetes.io/part-of: alternative-credit-scoring}
  annotations: {argocd.argoproj.io/sync-wave: "0"}
spec:
  schedule: "35 2 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 900
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 900
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels: {app.kubernetes.io/name: terms-retention, app.kubernetes.io/component: database-job, app.kubernetes.io/part-of: alternative-credit-scoring}
        spec:
          serviceAccountName: terms-retention
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
          containers:
            - name: terms-retention
              image: quay.io/finance2/terms-api@sha256:5555555555555555555555555555555555555555555555555555555555555555
              command: [node, dist/jobs/retention.js]
              envFrom: [{configMapRef: {name: terms-api-config}}]
              env:
                - {name: DATABASE_USER, value: terms_retention}
                - {name: DATABASE_PASSWORD_FILE, value: /run/secrets/terms/database-retention-password}
                - {name: RETENTION_BATCH_SIZE, value: "500"}
              resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {cpu: 250m, memory: 256Mi}}
              securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, readOnlyRootFilesystem: true}
              volumeMounts:
                - {name: runtime-secrets, mountPath: /run/secrets/terms, readOnly: true}
                - {name: tmp, mountPath: /tmp}
          volumes:
            - name: runtime-secrets
              projected:
                defaultMode: 256
                sources:
                  - secret:
                      name: terms-retention
                      items: [{key: database-retention-password, path: database-retention-password}]
            - {name: tmp, emptyDir: {sizeLimit: 64Mi}}
