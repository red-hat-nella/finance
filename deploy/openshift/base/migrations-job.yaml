apiVersion: batch/v1
kind: Job
metadata:
  name: migrations
  labels: {app.kubernetes.io/name: migrations, app.kubernetes.io/component: database-job}
spec:
  backoffLimit: 3
  template:
    metadata:
      labels: {app.kubernetes.io/name: migrations, app.kubernetes.io/component: database-job}
    spec:
      serviceAccountName: database-jobs
      restartPolicy: Never
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: migrations
          image: image-registry.openshift-image-registry.svc:5000/alternative-scoring/ingestion:1.0.0
          command: ["node", "dist/jobs/migrate.js"]
          env:
            - {name: DATABASE_HOST, valueFrom: {configMapKeyRef: {name: ingestion-config, key: DATABASE_HOST}}}
            - {name: DATABASE_PORT, valueFrom: {configMapKeyRef: {name: ingestion-config, key: DATABASE_PORT}}}
            - {name: DATABASE_NAME, valueFrom: {configMapKeyRef: {name: ingestion-config, key: DATABASE_NAME}}}
            - {name: DATABASE_USER, value: postgres}
            - {name: DATABASE_SSL_MODE, valueFrom: {configMapKeyRef: {name: ingestion-config, key: DATABASE_SSL_MODE}}}
            - {name: DATABASE_PASSWORD_FILE, value: /run/secrets/database-admin-password}
            - {name: RETENTION_DATABASE_PASSWORD_FILE, value: /run/secrets/database-retention-password}
          resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {cpu: 250m, memory: 256Mi}}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, readOnlyRootFilesystem: true}
          volumeMounts:
            - {name: secrets, mountPath: /run/secrets, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: secrets, secret: {secretName: scoring-secrets}}
        - {name: tmp, emptyDir: {}}
