apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: ingestion-from-frontend, labels: {app.kubernetes.io/part-of: alternative-credit-scoring}}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: ingestion}}
  policyTypes: [Ingress]
  ingress:
    - from: [{podSelector: {matchLabels: {app.kubernetes.io/name: frontend}}}]
      ports: [{protocol: TCP, port: 8080}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: ingestion-to-scoring-and-database, labels: {app.kubernetes.io/part-of: alternative-credit-scoring}}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: ingestion}}
  policyTypes: [Egress]
  egress:
    - to: [{podSelector: {matchLabels: {app.kubernetes.io/name: scoring}}}]
      ports: [{protocol: TCP, port: 8080}]
    - to: [{podSelector: {matchLabels: {app.kubernetes.io/name: postgres}}}]
      ports: [{protocol: TCP, port: 5432}]
