apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny}
spec: {podSelector: {}, policyTypes: [Ingress, Egress]}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: application-paths}
spec:
  podSelector: {matchExpressions: [{key: app.kubernetes.io/name, operator: In, values: [frontend, ingestion, scoring, postgres]}]}
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{namespaceSelector: {matchLabels: {network.openshift.io/policy-group: ingress}}}]
    - from: [{podSelector: {matchExpressions: [{key: app.kubernetes.io/name, operator: In, values: [frontend, ingestion, scoring]}]}}]
  egress:
    - to: [{namespaceSelector: {}}]
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 443}, {protocol: TCP, port: 5432}, {protocol: TCP, port: 8080}]

