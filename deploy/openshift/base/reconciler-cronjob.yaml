apiVersion: batch/v1
kind: CronJob
metadata: {name: reconciler}
spec:
  schedule: "* * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels: {app.kubernetes.io/name: reconciler, app.kubernetes.io/component: database-job}
        spec:
          serviceAccountName: database-jobs
          restartPolicy: Never
          securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
          containers:
            - name: reconciler
              image: image-registry.openshift-image-registry.svc:5000/alternative-scoring/ingestion:1.0.0
              command: ["node", "dist/jobs/reconciler.js"]
              envFrom: [{configMapRef: {name: ingestion-config}}]
              env:
                - {name: DATABASE_PASSWORD_FILE, value: /run/secrets/database-password}
              resources: {requests: {cpu: 25m, memory: 64Mi}, limits: {cpu: 200m, memory: 192Mi}}
              securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, readOnlyRootFilesystem: true}
              volumeMounts: [{name: secrets, mountPath: /run/secrets, readOnly: true}, {name: tmp, mountPath: /tmp}]
          volumes: [{name: secrets, secret: {secretName: scoring-secrets}}, {name: tmp, emptyDir: {}}]
