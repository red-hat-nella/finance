apiVersion: batch/v1
kind: CronJob
metadata: {name: retention}
spec:
  schedule: "15 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels: {app.kubernetes.io/name: retention, app.kubernetes.io/component: database-job}
        spec:
          serviceAccountName: database-jobs
          restartPolicy: Never
          securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
          containers:
            - name: retention
              image: image-registry.openshift-image-registry.svc:5000/alternative-scoring/ingestion:1.0.0
              command: ["node", "dist/cli.js", "retention", "--execute"]
              envFrom: [{configMapRef: {name: ingestion-config}}]
              env:
                - {name: DATABASE_USER, value: scoring_retention}
                - {name: DATABASE_PASSWORD_FILE, value: /run/secrets/database-retention-password}
                - {name: RETENTION_BATCH_SIZE, value: "500"}
              resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {cpu: 250m, memory: 256Mi}}
              securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, readOnlyRootFilesystem: true}
              volumeMounts: [{name: secrets, mountPath: /run/secrets, readOnly: true}, {name: tmp, mountPath: /tmp}]
          volumes: [{name: secrets, secret: {secretName: scoring-secrets}}, {name: tmp, emptyDir: {}}]
