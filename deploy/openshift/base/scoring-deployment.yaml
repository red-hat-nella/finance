apiVersion: apps/v1
kind: Deployment
metadata: {name: scoring, labels: {app.kubernetes.io/name: scoring}}
spec:
  replicas: 2
  selector: {matchLabels: {app.kubernetes.io/name: scoring}}
  template:
    metadata: {labels: {app.kubernetes.io/name: scoring}}
    spec:
      serviceAccountName: scoring
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: scoring
          image: image-registry.openshift-image-registry.svc:5000/alternative-scoring/scoring:1.0.0
          envFrom: [{configMapRef: {name: scoring-config}}]
          env: [{name: SCORING_SERVICE_TOKEN_FILE, value: /run/secrets/app/scoring-service-token}]
          ports: [{name: http, containerPort: 8080}]
          livenessProbe: {httpGet: {path: /health/live, port: http}, initialDelaySeconds: 10}
          readinessProbe: {httpGet: {path: /health/ready, port: http}, initialDelaySeconds: 5}
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: 500m, memory: 256Mi}}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, readOnlyRootFilesystem: true}
          volumeMounts: [{name: secrets, mountPath: /run/secrets/app, readOnly: true}, {name: tmp, mountPath: /tmp}]
      volumes: [{name: secrets, secret: {secretName: scoring-secrets}}, {name: tmp, emptyDir: {}}]

