apiVersion: apps/v1
kind: Deployment
metadata:
  name: scoring
  labels: {app.kubernetes.io/name: scoring, app.kubernetes.io/component: scoring, app.kubernetes.io/part-of: alternative-credit-scoring}
  annotations: {argocd.argoproj.io/sync-wave: "0"}
spec:
  replicas: 2
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  selector: {matchLabels: {app.kubernetes.io/name: scoring}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: scoring, app.kubernetes.io/component: scoring, app.kubernetes.io/part-of: alternative-credit-scoring}
    spec:
      serviceAccountName: scoring
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: scoring
          image: quay.io/finance2/scoring@sha256:3333333333333333333333333333333333333333333333333333333333333333
          envFrom: [{configMapRef: {name: scoring-config}}]
          env: [{name: SCORING_SERVICE_TOKEN_FILE, value: /run/secrets/scoring/scoring-service-token}]
          ports: [{name: http, containerPort: 8080, protocol: TCP}]
          livenessProbe: {httpGet: {path: /health/live, port: http}, initialDelaySeconds: 10, periodSeconds: 10, timeoutSeconds: 2, failureThreshold: 3}
          readinessProbe: {httpGet: {path: /health/ready, port: http}, initialDelaySeconds: 5, periodSeconds: 5, timeoutSeconds: 2, failureThreshold: 3}
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: 500m, memory: 256Mi}}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, readOnlyRootFilesystem: true}
          volumeMounts:
            - {name: runtime-secrets, mountPath: /run/secrets/scoring, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: runtime-secrets
          projected:
            defaultMode: 256
            sources:
              - secret:
                  name: scoring-runtime
                  items: [{key: scoring-service-token, path: scoring-service-token}]
        - {name: tmp, emptyDir: {sizeLimit: 64Mi}}
