apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-restore-test
  labels: {app.kubernetes.io/name: postgres-restore-test, app.kubernetes.io/component: database-job, app.kubernetes.io/part-of: alternative-credit-scoring}
  annotations: {platform.finance2/state: PENDING_VALIDATION, platform.finance2/rto: 4h-default-adjustable}
spec:
  suspend: true
  backoffLimit: 1
  activeDeadlineSeconds: 7200
  ttlSecondsAfterFinished: 86400
  template:
    metadata: {labels: {app.kubernetes.io/name: postgres-restore-test, app.kubernetes.io/component: database-job, app.kubernetes.io/part-of: alternative-credit-scoring}}
    spec:
      serviceAccountName: postgres
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: restore-test
          image: registry.redhat.io/rhel9/postgresql-16@sha256:b3a61b02f3e9b40160449463eb692e86d8a8386f443b96ac0802f92e50ac87e4
          command: [/bin/bash, -c]
          args:
            - |
              set -euo pipefail
              export PGPASSWORD="$(</run/secrets/database/database-backup-password)"
              curl --fail --silent --show-error --config /run/secrets/target/restore-curl.conf --output /work/backup.dump.enc
              openssl enc -d -aes-256-cbc -pbkdf2 -pass file:/run/secrets/target/encryption-passphrase -in /work/backup.dump.enc -out /work/backup.dump
              pg_restore -h postgres-restore-test -U scoring_backup -d alternative_scoring_restore --clean --if-exists --no-owner --no-privileges /work/backup.dump
              psql -h postgres-restore-test -U scoring_backup -d alternative_scoring_restore -v ON_ERROR_STOP=1 -c 'select count(*) from public.schema_migrations' >/dev/null
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: 500m, memory: 512Mi}}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, readOnlyRootFilesystem: true}
          volumeMounts:
            - {name: database, mountPath: /run/secrets/database, readOnly: true}
            - {name: target, mountPath: /run/secrets/target, readOnly: true}
            - {name: work, mountPath: /work}
      volumes:
        - name: database
          projected: {defaultMode: 256, sources: [{secret: {name: database-backup, items: [{key: database-backup-password, path: database-backup-password}]}}]}
        - name: target
          projected: {defaultMode: 256, sources: [{secret: {name: backup-target, items: [{key: restore-curl.conf, path: restore-curl.conf}, {key: encryption-passphrase, path: encryption-passphrase}]}}]}
        - {name: work, emptyDir: {sizeLimit: 2Gi}}
