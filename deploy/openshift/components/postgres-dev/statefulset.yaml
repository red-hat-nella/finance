apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels: {app.kubernetes.io/name: postgres, app.kubernetes.io/component: database, app.kubernetes.io/part-of: alternative-credit-scoring}
  annotations:
    platform.finance2/exception: writable data filesystem required for PostgreSQL; development only
spec:
  serviceName: postgres
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: postgres}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: postgres, app.kubernetes.io/component: database, app.kubernetes.io/part-of: alternative-credit-scoring}
    spec:
      serviceAccountName: postgres
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: postgres
          image: registry.redhat.io/rhel9/postgresql-16@sha256:b3a61b02f3e9b40160449463eb692e86d8a8386f443b96ac0802f92e50ac87e4
          env:
            - {name: POSTGRESQL_DATABASE, value: alternative_scoring}
            - {name: POSTGRESQL_USER, value: scoring_app}
            - {name: POSTGRESQL_PASSWORD, valueFrom: {secretKeyRef: {name: database-runtime, key: database-password}}}
            - {name: POSTGRESQL_ADMIN_PASSWORD, valueFrom: {secretKeyRef: {name: database-migrator, key: database-migrator-password}}}
          ports: [{name: postgres, containerPort: 5432, protocol: TCP}]
          readinessProbe: {exec: {command: [/bin/bash, -c, pg_isready -U scoring_app -d alternative_scoring]}, initialDelaySeconds: 10, periodSeconds: 5, timeoutSeconds: 3}
          livenessProbe: {exec: {command: [/bin/bash, -c, pg_isready -U scoring_app -d alternative_scoring]}, initialDelaySeconds: 30, periodSeconds: 10, timeoutSeconds: 3}
          resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: "1", memory: 1Gi}}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: data, mountPath: /var/lib/pgsql/data}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: data, persistentVolumeClaim: {claimName: postgres-data}}
        - {name: tmp, emptyDir: {sizeLimit: 128Mi}}
