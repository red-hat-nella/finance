apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
data:
  AUTH_MODE: development
  OIDC_ISSUER: https://identity.invalid
  OIDC_CLIENT_ID: development-not-used
  OIDC_SCOPE: openid
---
apiVersion: batch/v1
kind: Job
metadata:
  name: migrations
spec:
  template:
    spec:
      containers:
        - name: migrations
          env:
            - {name: DATABASE_USER, value: postgres}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: retention
spec:
  suspend: true
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: reconciler
spec:
  suspend: true
