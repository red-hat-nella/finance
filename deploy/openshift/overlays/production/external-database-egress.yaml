apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: runtime-and-jobs-to-external-database}
spec:
  podSelector:
    matchExpressions:
      - {key: app.kubernetes.io/name, operator: In, values: [ingestion, migrations, retention, reconciler]}
  policyTypes: [Egress]
  egress:
    - to: [{ipBlock: {cidr: 0.0.0.0/0}}]
      ports: [{protocol: TCP, port: 5432}]
