apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: alternative-scoring
resources: [../../base,external-postgres-service.yaml,external-database-egress.yaml]
images:
  - name: image-registry.openshift-image-registry.svc:5000/alternative-scoring/frontend
    newName: registry.example.internal/alternative-scoring/frontend
    newTag: 1.0.0
  - name: image-registry.openshift-image-registry.svc:5000/alternative-scoring/ingestion
    newName: registry.example.internal/alternative-scoring/ingestion
    newTag: 1.0.0
  - name: image-registry.openshift-image-registry.svc:5000/alternative-scoring/scoring
    newName: registry.example.internal/alternative-scoring/scoring
    newTag: 1.0.0
patches:
  - target: {kind: StatefulSet, name: postgres}
    patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: StatefulSet
      metadata: {name: postgres}
  - target: {kind: PersistentVolumeClaim, name: postgres-data}
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata: {name: postgres-data}
  - target: {kind: Service, name: postgres}
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata: {name: postgres}
  - target: {kind: ConfigMap, name: ingestion-config}
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata: {name: ingestion-config}
      data:
        DATABASE_HOST: external-postgres
        DATABASE_SSL_MODE: verify-full
