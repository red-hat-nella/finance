apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: alternative-scoring
resources: [../../base]
patches:
  - target: {kind: StatefulSet, name: postgres}
    patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: StatefulSet
      metadata: {name: postgres}
  - target: {kind: PersistentVolumeClaim, name: postgres-data}
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata: {name: postgres-data}

