apiVersion: v1
kind: ConfigMap
metadata:
  name: terms-api-config
  annotations:
    platform.finance2/state: PENDING_VALIDATION
    platform.finance2/input: managed terms PostgreSQL and approved OIDC destinations required
data:
  DATABASE_HOST: postgresql.production.invalid
  DATABASE_NAME: terms
  DATABASE_SSL_MODE: verify-full
  DATABASE_CA_FILE: /run/secrets/terms-database-tls/ca.crt
  DATABASE_SERVER_NAME: postgresql.production.invalid
  AUTH_ISSUER: https://identity.production.invalid
  AUTH_JWKS_URL: https://identity.production.invalid/.well-known/jwks.json
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: terms-web-config
  annotations:
    platform.finance2/state: PENDING_VALIDATION
    platform.finance2/input: approved public OIDC issuer and client registration required
data:
  OIDC_ISSUER: https://identity.production.invalid
  OIDC_CLIENT_ID: alternative-credit-scoring-terms-web-pending
