worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  server {
    listen 8080;
    server_name _;
    root /opt/app-root/src;
    location = /health/live { access_log off; return 200 '{"status":"ok","service":"frontend","version":"1.0.0"}'; add_header Content-Type application/json; }
    location /api/ { proxy_pass http://ingestion:8080; proxy_set_header X-Request-Id $request_id; proxy_set_header Host $host; }
    location / { try_files $uri $uri/ /index.html; }
    location ~* \.(?:js|css|woff2)$ { expires 1y; add_header Cache-Control "public, immutable"; }
    location = /runtime-config.json {
      alias /opt/app-root/runtime-config/runtime-config.json;
      add_header Cache-Control "no-store";
    }
  }
}
